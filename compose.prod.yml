# Palora production stack for the shared Kraftisium VPS (prod@185.139.7.99).
#
#   docker compose -f compose.prod.yml --env-file bff/.env.prod up -d
#
# Lessons baked in from the job-search deploy:
#   - Docker's embedded DNS is broken on this VPS -> fixed IPs on a private subnet,
#     services reference each other by IP, and the containers get public resolvers.
#   - 4 GB RAM -> the BFF image is built locally and shipped (scripts/vps-deploy.sh),
#     never built on the VPS. mem_limit keeps a runaway process from taking the box.
#   - Healthchecks must GET (HEAD is not routed); the image has curl installed.
#   - Ports: BFF 8010, Postgres/Redis stay off the host (see vps-docs/PORT_REGISTRY.txt).

name: palora

networks:
  palora:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.40.0/24

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    networks:
      palora:
        ipv4_address: 172.31.40.10
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-palora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in bff/.env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-palora}
    volumes:
      - palora_pg:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=60"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-palora} -d ${POSTGRES_DB:-palora}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      palora:
        ipv4_address: 172.31.40.11
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - palora_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 160m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }


  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    networks:
      palora:
        ipv4_address: 172.31.40.12
    environment:
      RUSTFS_ALLOW_INSECURE_DEFAULT_CREDENTIALS: "true"
    volumes:
      - palora_rustfs:/data
      - palora_rustfs_logs:/logs
    ports:
      - "127.0.0.1:9010:9000"
    mem_limit: 128m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  bff:
    image: ${BFF_IMAGE:-palora-bff:latest}
    restart: unless-stopped
    networks:
      palora:
        ipv4_address: 172.31.40.20
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_started
    env_file:
      - ./bff/.env.prod
    environment:
      BFF__APPLICATION_HOST: 0.0.0.0
      BFF__APPLICATION_PORT: "8000"
      BFF__DATABASE__HOST: 172.31.40.10
      BFF__DATABASE__PORT: "5432"
      BFF__DATABASE__USERNAME: ${POSTGRES_USER:-palora}
      BFF__DATABASE__PASSWORD: ${POSTGRES_PASSWORD}
      BFF__DATABASE__DATABASE_NAME: ${POSTGRES_DB:-palora}
      BFF__REDIS__HOST: 172.31.40.11
      BFF__REDIS__PORT: "6379"
      BFF__STORAGE__ENDPOINT: http://172.31.40.12:9000
      BFF__STORAGE__DIR: /app/uploads
      DATABASE_URL: postgres://${POSTGRES_USER:-palora}:${POSTGRES_PASSWORD}@172.31.40.10:5432/${POSTGRES_DB:-palora}
      RUST_LOG: info
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - palora_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    mem_limit: 512m
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

volumes:
  palora_pg:
  palora_redis:
  palora_rustfs:
  palora_rustfs_logs:
  palora_uploads:
