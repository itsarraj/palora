# /etc/nginx/conf.d/palora.conf  (shared nginx on the VPS, alongside kraftisium)

server {
    listen 80;
    server_name palora.kraftisium.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name palora.kraftisium.xyz;

    client_max_body_size 12m;          # photo uploads (BFF caps at BFF__STORAGE__MAX_UPLOAD_MB)

    ssl_certificate     /etc/letsencrypt/live/palora.kraftisium.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/palora.kraftisium.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000" always;

    root /var/www/palora;
    index index.html;

    location = /privacy {
        try_files /privacy.html =404;
    }

    location = /delete-account {
        try_files /delete-account.html =404;
    }

    location = /terms {
        try_files /terms.html =404;
    }

    location = /safety {
        try_files /safety.html =404;
    }

    location = /child-safety {
        try_files /safety.html =404;
    }


    location /media/ {
        proxy_pass http://127.0.0.1:9010/palora-media/;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;

        error_page 404 502 = @bff_media;
    }

    location @bff_media {
        proxy_pass http://127.0.0.1:8010/media/;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400";
    }

    location /api/v1/ws {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # rate limiter keys on this
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

